<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lumity Gallery ✨</title>
  <meta name="theme-color" content="#9b59b6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Lumity Gallery">
  <link rel="icon" id="favicon-link" href="">
  <link rel="apple-touch-icon" id="apple-touch-icon-link" href="">
  <link rel="manifest" id="manifest-link" href="">
  <style>
    :root {
      --bg: #0d0010;
      --surface: #1a0028;
      --surface2: #2a0040;
      --accent: #9b59b6;
      --accent2: #c39bd3;
      --glow: #7d3c98;
      --text: #e8d5f5;
      --text-muted: #a076b8;
      --border: #4a1a6e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Segoe UI', system-ui, sans-serif;
      min-height: 100vh;
    }

    header {
      text-align: center;
      padding: 2rem 1rem 1rem;
      background: linear-gradient(180deg, #1a0028 0%, transparent 100%);
      border-bottom: 1px solid var(--border);
    }

    header h1 {
      font-size: clamp(1.8rem, 5vw, 3rem);
      background: linear-gradient(135deg, #c39bd3, #9b59b6, #7d3c98);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: 0.05em;
      margin-bottom: 0.4rem;
    }

    header p {
      color: var(--text-muted);
      font-size: 0.9rem;
    }

    /* ── SOURCE BADGE ── */
    #source-badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      margin-top: 0.5rem;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text-muted);
      padding: 0.25rem 0.75rem;
      border-radius: 20px;
      font-size: 0.78rem;
    }
    #source-badge.json-mode {
      border-color: var(--accent);
      color: var(--accent2);
    }

    /* ── CONTROLS ── */
    .controls {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 10;
    }
    .controls-toggle {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 0.5rem;
      padding: 0.45rem 1rem;
      cursor: pointer;
      color: var(--text-muted);
      font-size: 0.8rem;
      user-select: none;
      transition: color 0.15s;
    }
    .controls-toggle:hover { color: var(--accent2); }
    .controls-toggle .chevron {
      display: inline-block;
      transition: transform 0.25s ease;
    }
    .controls.collapsed .chevron { transform: rotate(-180deg); }
    .controls-body {
      display: flex;
      gap: 0.75rem;
      align-items: center;
      justify-content: center;
      flex-wrap: wrap;
      padding: 0.75rem 1rem 1rem;
      overflow: hidden;
      max-height: 300px;
      transition: max-height 0.3s ease, padding 0.3s ease, opacity 0.25s ease;
      opacity: 1;
    }
    .controls.collapsed .controls-body {
      max-height: 0;
      padding-top: 0;
      padding-bottom: 0;
      opacity: 0;
      pointer-events: none;
    }

    .controls input[type="text"] {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.45rem 0.85rem;
      border-radius: 20px;
      font-size: 0.85rem;
      width: 220px;
      outline: none;
      transition: border-color 0.2s;
    }
    .controls input[type="text"]:focus { border-color: var(--accent); }

    .controls label {
      color: var(--text-muted);
      font-size: 0.82rem;
      display: flex;
      align-items: center;
      gap: 0.4rem;
    }

    .controls select {
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 0.4rem 0.6rem;
      border-radius: 8px;
      font-size: 0.83rem;
      outline: none;
    }

    .count-badge {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 0.3rem 0.75rem;
      border-radius: 20px;
      font-size: 0.8rem;
    }

    /* ── TOOLBAR BUTTONS ── */
    #install-btn, #download-btn, #download-json-btn, #folder-btn, #json-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 0.4rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.82rem;
      transition: background 0.15s, border-color 0.15s;
      white-space: nowrap;
    }
    #install-btn:hover, #download-btn:hover, #download-json-btn:hover, #folder-btn:hover, #json-btn:hover { background: var(--glow); border-color: var(--accent); color: #fff; }
    #download-btn:disabled, #download-json-btn:disabled { opacity: 0.5; cursor: default; }
    #folder-file-input, #json-file-input { display: none; }

    /* ── DRAG-OVER OVERLAY ── */
    #drop-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 500;
      background: rgba(13, 0, 16, 0.88);
      border: 4px dashed var(--accent);
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 1rem;
      backdrop-filter: blur(4px);
      pointer-events: none;
    }
    #drop-overlay.active { display: flex; }
    #drop-overlay .drop-icon { font-size: 4rem; }
    #drop-overlay p {
      font-size: 1.4rem;
      color: var(--accent2);
      font-weight: 600;
    }
    #drop-overlay small {
      color: var(--text-muted);
      font-size: 0.85rem;
    }

    /* ── GRID ── */
    #gallery {
      padding: 1rem;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--col-size, 180px), 1fr));
      gap: 10px;
    }

    .thumb {
      position: relative;
      aspect-ratio: 1;
      overflow: hidden;
      border-radius: 10px;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      transition: transform 0.2s, box-shadow 0.2s, border-color 0.2s;
    }
    .thumb:hover {
      transform: scale(1.03);
      box-shadow: 0 0 16px rgba(155, 89, 182, 0.5);
      border-color: var(--accent);
      z-index: 2;
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transition: opacity 0.3s;
    }
    .thumb img.loading { opacity: 0; }
    .thumb .overlay {
      position: absolute;
      inset: 0;
      background: linear-gradient(0deg, rgba(13,0,16,0.8) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.2s;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      padding: 6px;
      gap: 2px;
    }
    .thumb:hover .overlay { opacity: 1; }
    .thumb .overlay span {
      font-size: 0.65rem;
      color: var(--accent2);
      line-height: 1.2;
      word-break: break-all;
    }
    .thumb .overlay .overlay-dim {
      font-size: 0.7rem;
      color: #fff;
      font-weight: 600;
      letter-spacing: 0.02em;
    }

    /* ── LIGHTBOX ── */
    #lightbox {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 0.75rem;
      backdrop-filter: blur(6px);
    }
    #lightbox.open { display: flex; }

    #lightbox img {
      max-width: 92vw;
      max-height: 82vh;
      border-radius: 12px;
      border: 2px solid var(--accent);
      box-shadow: 0 0 40px rgba(155,89,182,0.4);
      object-fit: contain;
    }

    #lb-caption {
      color: var(--text-muted);
      font-size: 0.8rem;
      max-width: 80vw;
      text-align: center;
      word-break: break-all;
    }
    #lb-dim {
      color: var(--accent2);
      font-size: 0.85rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      min-height: 1.2em;
    }

    #lb-counter { color: var(--accent2); font-size: 0.85rem; }

    .lb-nav {
      display: flex;
      gap: 1rem;
      align-items: center;
    }

    .lb-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 0.5rem 1.2rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      transition: background 0.15s, border-color 0.15s;
    }
    .lb-btn:hover { background: var(--glow); border-color: var(--accent); color: #fff; }

    #lb-close {
      position: fixed;
      top: 1rem;
      right: 1.25rem;
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 2rem;
      cursor: pointer;
      line-height: 1;
      transition: color 0.15s;
    }
    #lb-close:hover { color: #fff; }

    /* ── SLIDESHOW ── */
    .ss-btn {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 0.35rem 0.9rem;
      border-radius: 8px;
      cursor: pointer;
      font-size: 0.8rem;
      transition: background 0.15s;
    }
    .ss-btn:hover, .ss-btn.active { background: var(--glow); color: #fff; border-color: var(--accent); }

    /* ── LOAD MORE ── */
    #load-more {
      display: block;
      margin: 1.5rem auto;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--accent2);
      padding: 0.6rem 2rem;
      border-radius: 24px;
      cursor: pointer;
      font-size: 0.9rem;
      transition: background 0.15s, border-color 0.15s;
    }
    #load-more:hover { background: var(--glow); border-color: var(--accent); color: #fff; }
    #load-more:disabled { opacity: 0.4; cursor: default; }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: 1.5rem;
      left: 50%;
      transform: translateX(-50%) translateY(4rem);
      background: var(--surface2);
      border: 1px solid var(--accent);
      color: var(--accent2);
      padding: 0.6rem 1.4rem;
      border-radius: 24px;
      font-size: 0.85rem;
      z-index: 2000;
      transition: transform 0.3s ease;
      pointer-events: none;
      white-space: nowrap;
    }
    #toast.show { transform: translateX(-50%) translateY(0); }

    footer {
      text-align: center;
      padding: 1.5rem;
      color: var(--text-muted);
      font-size: 0.78rem;
      border-top: 1px solid var(--border);
      margin-top: 1rem;
    }
  </style>
</head>

<script>
// ── ZIP WRITER ──────────────────────────────────────────────────────────────────
// Hand-rolled in place of a JSZip CDN dependency, so the page stays fully
// self-contained/offline like the rest of this repo. Writes STORE-method
// (uncompressed) entries only — every image format in this gallery is
// already compressed, so DEFLATE would save close to nothing here while
// costing a full compressor implementation.
const CRC32_TABLE = (() => {
  const table = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    table[n] = c >>> 0;
  }
  return table;
})();

function crc32(bytes) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < bytes.length; i++) c = CRC32_TABLE[(c ^ bytes[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function dosDateTime(date) {
  const time = ((date.getHours() & 0x1F) << 11) | ((date.getMinutes() & 0x3F) << 5) | ((date.getSeconds() >> 1) & 0x1F);
  const day = (((date.getFullYear() - 1980) & 0x7F) << 9) | (((date.getMonth() + 1) & 0xF) << 5) | (date.getDate() & 0x1F);
  return { time, day };
}

function writeU16LE(arr, offset, val) { arr[offset] = val & 0xFF; arr[offset + 1] = (val >>> 8) & 0xFF; }
function writeU32LE(arr, offset, val) {
  arr[offset] = val & 0xFF; arr[offset + 1] = (val >>> 8) & 0xFF;
  arr[offset + 2] = (val >>> 16) & 0xFF; arr[offset + 3] = (val >>> 24) & 0xFF;
}

// entries: [{name, data: Uint8Array}] → Blob containing a valid .zip file.
function buildZip(entries) {
  const encoder = new TextEncoder();
  const { time, day } = dosDateTime(new Date());
  const localParts = [];
  const centralParts = [];
  let offset = 0;

  entries.forEach(({ name, data }) => {
    const nameBytes = encoder.encode(name);
    const crc = crc32(data);
    const size = data.length;

    const local = new Uint8Array(30 + nameBytes.length);
    writeU32LE(local, 0, 0x04034b50);
    writeU16LE(local, 4, 20);   // version needed
    writeU16LE(local, 6, 0);    // flags
    writeU16LE(local, 8, 0);    // method: 0 = stored
    writeU16LE(local, 10, time);
    writeU16LE(local, 12, day);
    writeU32LE(local, 14, crc);
    writeU32LE(local, 18, size); // compressed size
    writeU32LE(local, 22, size); // uncompressed size
    writeU16LE(local, 26, nameBytes.length);
    writeU16LE(local, 28, 0);   // extra field length
    local.set(nameBytes, 30);
    localParts.push(local, data);

    const central = new Uint8Array(46 + nameBytes.length);
    writeU32LE(central, 0, 0x02014b50);
    writeU16LE(central, 4, 20);  // version made by
    writeU16LE(central, 6, 20);  // version needed
    writeU16LE(central, 8, 0);
    writeU16LE(central, 10, 0);
    writeU16LE(central, 12, time);
    writeU16LE(central, 14, day);
    writeU32LE(central, 16, crc);
    writeU32LE(central, 20, size);
    writeU32LE(central, 24, size);
    writeU16LE(central, 28, nameBytes.length);
    writeU16LE(central, 30, 0); // extra field length
    writeU16LE(central, 32, 0); // comment length
    writeU16LE(central, 34, 0); // disk number
    writeU16LE(central, 36, 0); // internal attrs
    writeU32LE(central, 38, 0); // external attrs
    writeU32LE(central, 42, offset);
    central.set(nameBytes, 46);
    centralParts.push(central);

    offset += local.length + data.length;
  });

  const centralStart = offset;
  const centralSize = centralParts.reduce((sum, c) => sum + c.length, 0);

  const eocd = new Uint8Array(22);
  writeU32LE(eocd, 0, 0x06054b50);
  writeU16LE(eocd, 4, 0);
  writeU16LE(eocd, 6, 0);
  writeU16LE(eocd, 8, entries.length);
  writeU16LE(eocd, 10, entries.length);
  writeU32LE(eocd, 12, centralSize);
  writeU32LE(eocd, 16, centralStart);
  writeU16LE(eocd, 20, 0);

  return new Blob([...localParts, ...centralParts, eocd], { type: 'application/zip' });
}

const MIME_MAP = {
  jpg: 'image/jpeg', jpeg: 'image/jpeg',
  png: 'image/png', gif: 'image/gif', webp: 'image/webp'
};

function extMime(filename) {
  const ext = filename.split('.').pop().toLowerCase();
  return MIME_MAP[ext] || 'image/jpeg';
}

// Active image list — starts with folder images, replaced when JSON is loaded
/* FOLDER_IMAGES points at relative paths under a local "lumity/" folder that
   sits next to this file on the machine it was generated on — it is kept
   here only as the original export's manifest, not loaded automatically,
   since those files aren't necessarily present wherever this page is
   opened/hosted. Use "Open Folder" or "Load JSON" to actually load images. */
let ALL_IMAGES = [];

// ── STATE ─────────────────────────────────────────────────────────────────────
const PAGE_SIZE = 60;
let filtered = ALL_IMAGES.slice();
let rendered = 0;
let lbIndex = 0;
let ssTimer = null;

// ── ELEMENTS ──────────────────────────────────────────────────────────────────
const gallery     = document.getElementById('gallery');
const loadMore    = document.getElementById('load-more');
const countBadge  = document.getElementById('count-badge');
const sourceBadge = document.getElementById('source-badge');
const lb          = document.getElementById('lightbox');
const lbImg       = document.getElementById('lb-img');
const lbCaption   = document.getElementById('lb-caption');
const lbCounter   = document.getElementById('lb-counter');
const toast       = document.getElementById('toast');
const dropOverlay = document.getElementById('drop-overlay');

// ── TOAST ─────────────────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => toast.classList.remove('show'), 3000);
}

// ── SOURCE SWITCH ─────────────────────────────────────────────────────────────
function loadFromJson(file) {
  if (!file || !file.name.endsWith('.json')) {
    showToast('Please drop a .json file.');
    return;
  }
  const reader = new FileReader();
  reader.onload = e => {
    let data;
    try { data = JSON.parse(e.target.result); }
    catch { showToast('Invalid JSON file.'); return; }

    if (!data.files || !Array.isArray(data.files)) {
      showToast('JSON missing "files" array.');
      return;
    }

    ALL_IMAGES = data.files.map(f => ({
      name: f.filename,
      url: 'data:' + extMime(f.filename) + ';base64,' + f.data
    }));

    const folderName = data.folder || file.name.replace('.json','');
    sourceBadge.textContent = '📦 ' + folderName + ' — ' + ALL_IMAGES.length + ' images (JSON)';
    sourceBadge.className = 'json-mode';

    resetGallery();
    showToast('Loaded ' + ALL_IMAGES.length + ' images from JSON ✨');
  };
  reader.readAsText(file);
}

// ── SIZE CONTROL ──────────────────────────────────────────────────────────────
document.getElementById('size-select').addEventListener('change', e => {
  gallery.style.setProperty('--col-size', e.target.value + 'px');
});

// ── SEARCH ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  const q = e.target.value.toLowerCase();
  filtered = ALL_IMAGES.filter(img => img.name.toLowerCase().includes(q));
  rendered = 0;
  gallery.innerHTML = '';
  renderBatch();
  updateCount();
});

function shuffle(arr) {
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [arr[i], arr[j]] = [arr[j], arr[i]];
  }
}

function resetGallery() {
  const q = document.getElementById('search').value.toLowerCase();
  filtered = ALL_IMAGES.filter(img => img.name.toLowerCase().includes(q));
  shuffle(filtered);
  rendered = 0;
  gallery.innerHTML = '';
  renderBatch();
  updateCount();
}

// ── RENDER ────────────────────────────────────────────────────────────────────
function updateCount() {
  countBadge.textContent = filtered.length + ' images';
  loadMore.disabled = rendered >= filtered.length;
  loadMore.textContent = rendered < filtered.length
    ? 'Load more (' + (filtered.length - rendered) + ' remaining)'
    : 'All loaded';
}

function renderBatch() {
  const batch = filtered.slice(rendered, rendered + PAGE_SIZE);
  batch.forEach((img, i) => {
    const idx = rendered + i;
    const div = document.createElement('div');
    div.className = 'thumb';

    const el = document.createElement('img');
    el.className = 'loading';
    el.alt = img.name;
    el.loading = 'lazy';
    el.src = img.url;
    const dimSpan = document.createElement('span');
    dimSpan.className = 'overlay-dim';
    el.addEventListener('load', () => {
      el.classList.remove('loading');
      dimSpan.textContent = el.naturalWidth + ' × ' + el.naturalHeight;
    });
    el.addEventListener('error', () => {
      div.style.display = 'none';
      filtered = filtered.filter(x => x !== img);
      updateCount();
    });

    const ov = document.createElement('div');
    ov.className = 'overlay';
    const sp = document.createElement('span');
    sp.textContent = img.name;
    ov.appendChild(dimSpan);
    ov.appendChild(sp);

    div.appendChild(el);
    div.appendChild(ov);
    div.addEventListener('click', () => openLightbox(idx));
    gallery.appendChild(div);
  });
  rendered += batch.length;
  updateCount();
}

loadMore.addEventListener('click', renderBatch);

// ── LIGHTBOX ──────────────────────────────────────────────────────────────────
function openLightbox(idx) {
  lbIndex = idx;
  showLb();
  lb.classList.add('open');
}

const lbDim = document.getElementById('lb-dim');

function showLb() {
  const img = filtered[lbIndex];
  lbDim.textContent = '';
  lbImg.onload = () => { lbDim.textContent = lbImg.naturalWidth + ' × ' + lbImg.naturalHeight + ' px'; };
  lbImg.src = img.url;
  lbCaption.textContent = img.name;
  lbCounter.textContent = (lbIndex + 1) + ' / ' + filtered.length;
}

function closeLb() {
  lb.classList.remove('open');
  stopSlideshow();
}

function ensureRendered(idx) {
  while (rendered <= idx && rendered < filtered.length) renderBatch();
}

document.getElementById('lb-close').addEventListener('click', closeLb);
document.getElementById('lb-prev').addEventListener('click', () => {
  lbIndex = (lbIndex - 1 + filtered.length) % filtered.length;
  ensureRendered(lbIndex);
  showLb();
});
document.getElementById('lb-next').addEventListener('click', () => {
  lbIndex = (lbIndex + 1) % filtered.length;
  ensureRendered(lbIndex);
  showLb();
});

lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });

document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
    lbIndex = (lbIndex + 1) % filtered.length;
    ensureRendered(lbIndex);
    showLb();
  } else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
    lbIndex = (lbIndex - 1 + filtered.length) % filtered.length;
    ensureRendered(lbIndex);
    showLb();
  } else if (e.key === 'Escape') {
    closeLb();
  }
});

// ── SLIDESHOW ─────────────────────────────────────────────────────────────────
const ssToggle = document.getElementById('ss-toggle');
ssToggle.addEventListener('click', () => {
  if (ssTimer) stopSlideshow();
  else {
    if (!lb.classList.contains('open')) openLightbox(0);
    startSlideshow();
  }
});

function startSlideshow() {
  const speed = parseInt(document.getElementById('ss-speed').value);
  ssToggle.textContent = '⏹ Stop';
  ssToggle.classList.add('active');
  ssTimer = setInterval(() => {
    lbIndex = (lbIndex + 1) % filtered.length;
    ensureRendered(lbIndex);
    showLb();
  }, speed);
}

function stopSlideshow() {
  clearInterval(ssTimer);
  ssTimer = null;
  ssToggle.textContent = '▶ Slideshow';
  ssToggle.classList.remove('active');
}

// ── SHUFFLE ───────────────────────────────────────────────────────────────────
document.getElementById('shuffle-btn').addEventListener('click', () => {
  for (let i = filtered.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [filtered[i], filtered[j]] = [filtered[j], filtered[i]];
  }
  rendered = 0;
  gallery.innerHTML = '';
  renderBatch();
  updateCount();
  showToast('Images shuffled 🔀');
});


// ── FOLDER BUTTON ─────────────────────────────────────────────────────────────
const IMAGE_EXTS = new Set(['jpg','jpeg','png','gif','webp']);

const folderFileInput = document.getElementById('folder-file-input');
document.getElementById('folder-btn').addEventListener('click', () => folderFileInput.click());
folderFileInput.addEventListener('change', e => {
  const files = [...e.target.files].filter(f => IMAGE_EXTS.has(f.name.split('.').pop().toLowerCase()));
  if (!files.length) { showToast('No images found in folder.'); return; }

  ALL_IMAGES = files.map(f => ({
    name: f.name,
    url: URL.createObjectURL(f),
  }));

  const folderName = files[0].webkitRelativePath.split('/')[0];
  sourceBadge.textContent = '📁 ' + folderName + ' — ' + ALL_IMAGES.length + ' images';
  sourceBadge.className = 'json-mode';
  resetGallery();
  showToast('Loaded ' + ALL_IMAGES.length + ' images from folder ✨');
  e.target.value = '';
});

// ── JSON BUTTON ───────────────────────────────────────────────────────────────
const jsonFileInput = document.getElementById('json-file-input');
document.getElementById('json-btn').addEventListener('click', () => jsonFileInput.click());
jsonFileInput.addEventListener('change', e => {
  if (e.target.files[0]) loadFromJson(e.target.files[0]);
  e.target.value = '';
});

// ── DRAG & DROP ───────────────────────────────────────────────────────────────
let dragCounter = 0;

document.addEventListener('dragenter', e => {
  if ([...e.dataTransfer.types].includes('Files')) {
    dragCounter++;
    dropOverlay.classList.add('active');
  }
});

document.addEventListener('dragleave', () => {
  dragCounter--;
  if (dragCounter <= 0) { dragCounter = 0; dropOverlay.classList.remove('active'); }
});

document.addEventListener('dragover', e => e.preventDefault());

document.addEventListener('drop', e => {
  e.preventDefault();
  dragCounter = 0;
  dropOverlay.classList.remove('active');
  const file = e.dataTransfer.files[0];
  if (file) loadFromJson(file);
});

// ── DOWNLOAD ZIP ──────────────────────────────────────────────────────────────
document.getElementById('download-btn').addEventListener('click', async () => {
  const btn = document.getElementById('download-btn');
  const total = filtered.length;
  if (!total) { showToast('No images to download.'); return; }

  btn.disabled = true;

  const entries = [];
  const seen = new Map();

  for (let i = 0; i < total; i++) {
    const img = filtered[i];
    btn.textContent = `⏳ ${i + 1} / ${total}`;

    let data;
    if (img.url.startsWith('data:')) {
      const b64 = img.url.split(',')[1];
      data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    } else {
      const res = await fetch(img.url);
      data = new Uint8Array(await res.arrayBuffer());
    }

    // deduplicate filenames
    let name = img.name;
    const count = seen.get(name) ?? 0;
    seen.set(name, count + 1);
    if (count > 0) {
      const dot = name.lastIndexOf('.');
      name = dot === -1 ? `${name} (${count})` : `${name.slice(0, dot)} (${count})${name.slice(dot)}`;
    }

    entries.push({ name, data });
  }

  btn.textContent = '⏳ Compressing…';
  const blob = buildZip(entries);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lumity-gallery.zip';
  a.click();
  URL.revokeObjectURL(a.href);

  btn.disabled = false;
  btn.textContent = '⬇ Download ZIP';
  showToast('Downloaded ' + total + ' images ✨');
});

// ── DOWNLOAD JSON ─────────────────────────────────────────────────────────────
document.getElementById('download-json-btn').addEventListener('click', async () => {
  const btn = document.getElementById('download-json-btn');
  const total = filtered.length;
  if (!total) { showToast('No images to download.'); return; }

  btn.disabled = true;

  const files = [];
  for (let i = 0; i < total; i++) {
    const img = filtered[i];
    btn.textContent = `⏳ ${i + 1} / ${total}`;

    let b64;
    if (img.url.startsWith('data:')) {
      b64 = img.url.split(',')[1];
    } else {
      const res = await fetch(img.url);
      const ab = await res.arrayBuffer();
      b64 = btoa(String.fromCharCode(...new Uint8Array(ab)));
    }
    files.push({ filename: img.name, data: b64 });
  }

  const folderName = sourceBadge.textContent.replace(/📁|📦|\s*—.*$/g, '').trim() || 'lumity';
  const payload = JSON.stringify({ folder: folderName, files });
  const blob = new Blob([payload], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = folderName + '.json';
  a.click();
  URL.revokeObjectURL(a.href);

  btn.disabled = false;
  btn.textContent = '⬇ Download JSON';
  showToast('Downloaded ' + total + ' images as JSON ✨');
});

// ── SORT BY DIMENSIONS ────────────────────────────────────────────────────────
const dimCache = new Map();
let dimSortDir = 1;

function getDimensions(url) {
  if (dimCache.has(url)) return Promise.resolve(dimCache.get(url));
  return new Promise(resolve => {
    const img = new Image();
    img.onload = () => {
      const px = img.naturalWidth * img.naturalHeight;
      dimCache.set(url, px);
      resolve(px);
    };
    img.onerror = () => { dimCache.set(url, 0); resolve(0); };
    img.src = url;
  });
}

const sortDimBtn = document.getElementById('sort-dim-btn');
sortDimBtn.addEventListener('click', async () => {
  sortDimBtn.disabled = true;
  sortDimBtn.textContent = '⏳ Measuring…';

  const withDims = await Promise.all(filtered.map(async img => ({ img, px: await getDimensions(img.url) })));
  withDims.sort((a, b) => dimSortDir * (a.px - b.px));
  filtered = withDims.map(x => x.img);

  dimSortDir *= -1;
  sortDimBtn.textContent = dimSortDir === 1 ? '⇅ Dim ↑' : '⇅ Dim ↓';
  sortDimBtn.disabled = false;

  rendered = 0;
  gallery.innerHTML = '';
  renderBatch();
});

// ── COLLAPSIBLE MENU ──────────────────────────────────────────────────────────
document.getElementById('controls-toggle').addEventListener('click', () => {
  document.getElementById('controls').classList.toggle('collapsed');
});

// ── INSTALLABILITY ────────────────────────────────────────────────────────────
function buildIconDataUrl(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#9b59b6';
  ctx.fillRect(0, 0, size, size);
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold ' + Math.round(size * 0.56) + 'px Georgia, serif';
  ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.fillText('L', size / 2, size * 0.56);
  return canvas.toDataURL('image/png');
}

function setupInstallability() {
  const icon192 = buildIconDataUrl(192);
  const icon512 = buildIconDataUrl(512);
  document.getElementById('favicon-link').setAttribute('href', icon192);
  document.getElementById('apple-touch-icon-link').setAttribute('href', icon192);
  // start_url/id/scope resolve against the MANIFEST's own URL, not the
  // document's — a data: URI manifest has no base to resolve a relative "."
  // against, so the page's own absolute location is used instead.
  const here = location.href.split('#')[0];
  const manifest = {
    name: 'Lumity Gallery', short_name: 'Lumity',
    id: here, start_url: here, scope: here,
    display: 'standalone',
    background_color: '#0d0010', theme_color: '#9b59b6',
    icons: [{ src: icon192, sizes: '192x192', type: 'image/png' }, { src: icon512, sizes: '512x512', type: 'image/png' }]
  };
  document.getElementById('manifest-link').setAttribute('href', 'data:application/manifest+json;base64,' + btoa(JSON.stringify(manifest)));
}

// Registered at top level so it's listening before the browser evaluates
// installability — Chrome only fires this once the page passes every
// installability check (valid manifest, secure origin, etc).
let deferredInstallPrompt = null;
window.addEventListener('beforeinstallprompt', (e) => {
  e.preventDefault();
  deferredInstallPrompt = e;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = '';
});
window.addEventListener('appinstalled', () => {
  deferredInstallPrompt = null;
  const btn = document.getElementById('install-btn');
  if (btn) btn.style.display = 'none';
  showToast('Installed ✨');
});

document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredInstallPrompt) return;
  const btn = document.getElementById('install-btn');
  btn.style.display = 'none';
  deferredInstallPrompt.prompt();
  await deferredInstallPrompt.userChoice;
  deferredInstallPrompt = null;
});

// ── INIT ──────────────────────────────────────────────────────────────────────
setupInstallability();
shuffle(filtered);
renderBatch();
</script>
</body>
</html>
